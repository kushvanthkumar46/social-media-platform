<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | SocialApp</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="top-nav">
        <h2>SocialApp</h2>
        <div>
          <a href="./home.html">Home</a>
          <a href="./profile.html">Profile</a>
        </div>
      </nav>

      <main class="dashboard">
        <section class="card composer-card">
          <h3>Create Post</h3>
          <input id="postImage" type="url" placeholder="Image URL (optional)" />
          <textarea id="postText" placeholder="Write a caption..."></textarea>
          <button id="createPostBtn">Share</button>
        </section>

        <section class="card">
          <h3>Feed</h3>
          <div id="feed" class="feed-list"></div>
        </section>
      </main>
    </div>

    <script src="./home.js"></script>
  </body>
</html>
